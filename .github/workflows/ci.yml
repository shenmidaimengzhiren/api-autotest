name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 允许在 GitHub 页面手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 运行测试
        run: python -m pytest -v --html=report.html --self-contained-html

      - name: 上传测试报告
        if: always() # 即使测试失败也上传报告，方便排查
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.html
